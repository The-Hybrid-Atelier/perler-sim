name: Trigger auto deployment for fuseblocks-app

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ main ]
    paths:
    - '**'
    - '.github/workflows/fuseblocks-app-AutoDeployTrigger-787f4e38-361f-47f1-8970-c17d979dbb30.yml'

  # Allow manual trigger 
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v1
        with:
          client-id: ${{ secrets.FUSEBLOCKSAPP_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.FUSEBLOCKSAPP_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.FUSEBLOCKSAPP_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}
          _dockerfilePathKey_: _dockerfilePath_
          registryUrl: fuseblocksacr.azurecr.io
          registryUsername: ${{ secrets.FUSEBLOCKSAPP_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.FUSEBLOCKSAPP_REGISTRY_PASSWORD }}
          containerAppName: fuseblocks-app
          resourceGroup: FuseBlocks
          imageToBuild: fuseblocksacr.azurecr.io/fuseblocks-app:${{ github.sha }}
          _buildArgumentsKey_: |
            _buildArgumentsValues_


